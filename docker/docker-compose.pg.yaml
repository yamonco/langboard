x-db-env: &db-env
  POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
  POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
  POSTGRESQL_USERNAME: ${POSTGRES_USER}
  POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRESQL_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS}
  POSTGRESQL_LOG_TIMEZONE: UTC
  POSTGRESQL_TIMEZONE: UTC

services:
  db-bouncer:
    init: true
    image: bitnamilegacy/pgbouncer:latest
    container_name: ${PROJECT_NAME}_db_bouncer
    ports:
      - 6432:6432
    environment:
      - POSTGRESQL_HOST=db
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_AUTH_TYPE=trust
      - PGBOUNCER_USERLIST_FILE=/bitnami/userlists.txt
      - PGBOUNCER_DSN_0=master=host=db port=5432 dbname=${POSTGRES_DB}
      - PGBOUNCER_DSN_1=readonly=host=db-replica port=5432 dbname=${POSTGRES_DB}
      - PGBOUNCER_MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN}
      - PGBOUNCER_SERVER_IDLE_TIMEOUT=${PGBOUNCER_SERVER_IDLE_TIMEOUT}
      - PGBOUNCER_CLIENT_IDLE_TIMEOUT=${PGBOUNCER_CLIENT_IDLE_TIMEOUT}
      - PGBOUNCER_DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE}
      - PGBOUNCER_RESERVE_POOL_TIMEOUT=${PGBOUNCER_RESERVE_POOL_TIMEOUT}
      - PGBOUNCER_QUERY_WAIT_TIMEOUT=${PGBOUNCER_QUERY_WAIT_TIMEOUT}
    volumes:
      - ./db_bouncer/userlists.txt:/bitnami/userlists.txt
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/bitnami/postgresql/bin/psql -h 127.0.0.1 -p 6432 -U "$${POSTGRESQL_USERNAME}" master -Atc "SELECT 1" >/dev/null 2>&1 && /opt/bitnami/postgresql/bin/psql -h 127.0.0.1 -p 6432 -U "$${POSTGRESQL_USERNAME}" readonly -Atc "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - net
    restart: always

  db:
    init: true
    image: bitnamilegacy/postgresql:latest
    container_name: ${PROJECT_NAME}_db
    ports:
      - ${MASTER_POSTGRES_PORT}:5432
    environment:
      <<: *db-env
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
    volumes:
      - pgdata:/bitnami/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(PGPASSWORD="$${POSTGRESQL_PASSWORD}" /opt/bitnami/postgresql/bin/psql -U "$${POSTGRESQL_USERNAME}" -d postgres -Atc "SELECT NOT pg_is_in_recovery()" 2>/dev/null)" = t
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - net
    restart: always

  db-replica:
    init: true
    image: bitnamilegacy/postgresql:latest
    container_name: ${PROJECT_NAME}_db_replica
    ports:
      - ${REPLICA_POSTGRES_PORT}:5432
    environment:
      <<: *db-env
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: ${PROJECT_NAME}_db
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(PGPASSWORD="$${POSTGRESQL_PASSWORD}" /opt/bitnami/postgresql/bin/psql -U "$${POSTGRESQL_USERNAME}" -d postgres -Atc "SELECT pg_is_in_recovery()" 2>/dev/null)" = t
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: always

volumes:
  pgdata:
    driver: local
