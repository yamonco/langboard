services:
  server:
    init: true
    container_name: ${PROJECT_NAME}_server
    image: nginx:latest
    ports:
      - "${NGINX_UI_EXPOSE_PORT}:8000"
      - "${NGINX_SOCKET_EXPOSE_PORT}:8010"
      - "${NGINX_API_EXPOSE_PORT}:8020"
      - "${DOCS_EXPOSE_PORT}:8030"
    env_file:
      - ./envs/.nginx.env
    environment:
      SOCKET_EDITOR_HOST: ${PROJECT_NAME}_socket
      SOCKET_EDITOR_PORT: ${SOCKET_PORT}
    volumes:
      - ./server/conf.template:/etc/nginx/templates/default.conf.template
      - ./server/nginx.conf:/etc/nginx/nginx.conf
      - ../src/ui/dist:/usr/share/nginx/html
    command: [nginx-debug, "-g", "daemon off;"]
    depends_on:
      ui:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      socket:
        condition: service_healthy
    networks:
      - net
    restart: always

  ui:
    init: true
    container_name: ${PROJECT_NAME}_ui
    build:
      context: ../src
      dockerfile: ui/Dockerfile
    env_file:
      - ./envs/.ui.env
    working_dir: /app
    command: sh -c "cd /shared/ts && yarn build && cd /app && yarn link @langboard/core && yarn build"
    volumes:
      - ../src/ui/src:/app/src
      - ../src/ui/dist:/app/dist:rw
      - ../src/shared/ts/src:/shared/ts/src
      - ../src/ui/vite.config.ts:/app/vite.config.ts
      - ../src/ui/tailwind.config.js:/app/tailwind.config.js
      - ../src/ui/postcss.config.js:/app/postcss.config.js
    networks:
      - net

  api: &api
    init: true
    container_name: ${PROJECT_NAME}_api
    build:
      context: ../
      target: with-cron
    env_file:
      - ./envs/.api.env
    environment:
      WORKER: main
      SOCKET_PHOENIX_INTERNAL_SECRET: ${SOCKET_PHOENIX_INTERNAL_SECRET:-}
    working_dir: /app
    command: uv run --no-sync ${PROJECT_NAME} run --workers ${API_WORKERS_COUNT:-1}
    stop_grace_period: 16m
    volumes:
      - ../src/api/${PROJECT_NAME}:/app/src/api/${PROJECT_NAME}
      - ../src/shared/py:/app/src/shared/py
      - shared-py-venv:/app/shared/py/.venv
      - ../src/resources:/app/src/resources
      - ../pyproject.toml:/app/pyproject.toml
      - ../uv.lock:/app/uv.lock
      - ../README.md:/app/README.md
      - ../LICENSE:/app/LICENSE
      - ../alembic.ini:/app/alembic.ini
      - ../local:/app/local
      - ../scripts/run_bot_cron.sh:/app/scripts/run_bot_cron.sh:x
      - ../scripts/run_notification_cron.sh:/app/scripts/run_notification_cron.sh:x
      - ../scripts/run_notification_recovery.sh:/app/scripts/run_notification_recovery.sh:x
      - ../scripts/run_ollama_pull_recovery.sh:/app/scripts/run_ollama_pull_recovery.sh:x
      - ../scripts/run_internal_bot_run_recovery.sh:/app/scripts/run_internal_bot_run_recovery.sh:x
      - ./volumes/.vault-credentials:/app/.vault-credentials:ro
    depends_on:
      db-bouncer:
        condition: service_healthy
      kafka0:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen("http://${PROJECT_NAME}_api:5381/health", timeout=2)
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      - net
    restart: always

  celeryworker:
    <<: *api
    init: true
    container_name: ${PROJECT_NAME}_celeryworker
    build:
      context: ../
      target: with-document-processing
    command: uv run --no-sync ${PROJECT_NAME} run:broker
    healthcheck:
      disable: true
    stop_grace_period: 16m

  socket:
    init: true
    container_name: ${PROJECT_NAME}_socket
    build:
      context: ../src
      dockerfile: socket/Dockerfile
    env_file:
      - ./envs/.socket.env
    environment:
      SOCKET_PHOENIX_INTERNAL_SECRET: ${SOCKET_PHOENIX_INTERNAL_SECRET:-}
    working_dir: /app
    stop_grace_period: 16m
    volumes:
      - ../src/socket/package.json:/app/package.json
      - ../src/socket/yarn.lock:/app/yarn.lock
      - ../src/socket/src:/app/src
      - ../src/shared/ts:/shared/ts
      - ../src/resources:/app/resources
      - ../.env:/app/.env
      - ./volumes/socket_editor_sync:/local/editor-sync
      - ./volumes/.vault-credentials:/app/.vault-credentials:ro
    depends_on:
      db-bouncer:
        condition: service_healthy
      kafka0:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      graph:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require("net");const socket=net.connect(5690,"127.0.0.1",()=>{socket.end();process.exit(0)});socket.on("error",()=>process.exit(1));setTimeout(()=>process.exit(1),2000)
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - net
    restart: always

  socket-phoenix:
    profiles:
      - socket-phoenix
    init: true
    container_name: ${PROJECT_NAME}_socket_phoenix
    image: ${PROJECT_NAME}-socket-phoenix:dev
    build:
      context: ../src
      dockerfile: socket_phoenix/Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${SOCKET_PHOENIX_EXPOSE_PORT:-5691}:5690"
    environment:
      SECRET_KEY_BASE: ${SOCKET_PHOENIX_SECRET_KEY_BASE:-}
      SOCKET_PHOENIX_INTERNAL_SECRET: ${SOCKET_PHOENIX_INTERNAL_SECRET:-}
      API_INTERNAL_URL: http://${PROJECT_NAME}_api:5381
      DEFAULT_GRAPH_URL: http://${PROJECT_NAME}_graph:${GRAPH_PORT}
      CACHE_URL: redis://:${REDIS_PASSWORD}@${PROJECT_NAME}_redis:6379/0
      BROADCAST_URLS: ${PROJECT_NAME}_kafka0:9092,${PROJECT_NAME}_kafka1:9092,${PROJECT_NAME}_kafka2:9092
      BROADCAST_PHOENIX_FANOUT_CONSUMER_GROUP: ${BROADCAST_PHOENIX_FANOUT_CONSUMER_GROUP:-}
      BROADCAST_MAX_MESSAGE_BYTES: ${BROADCAST_MAX_MESSAGE_BYTES:-10485760}
      BROADCAST_PHOENIX_DEAD_LETTER_TOPIC: ${BROADCAST_PHOENIX_DEAD_LETTER_TOPIC:-}
      SOCKET_PHOENIX_KAFKA_ENABLED: "true"
      SOCKET_PHOENIX_LEGACY_REDIS_ENABLED: "true"
      SOCKET_PHOENIX_KAFKA_LAG_POLL_INTERVAL_MS: ${SOCKET_PHOENIX_KAFKA_LAG_POLL_INTERVAL_MS:-1000}
      SOCKET_PHOENIX_EDITOR_SYNC_ENABLED: ${SOCKET_PHOENIX_EDITOR_SYNC_ENABLED:-false}
      SOCKET_PHOENIX_EDITOR_AI_ENABLED: ${SOCKET_PHOENIX_EDITOR_AI_ENABLED:-false}
      SOCKET_PHOENIX_EDITOR_SYNC_EXPECTED_NODES: ${SOCKET_PHOENIX_EDITOR_SYNC_EXPECTED_NODES:-}
      SOCKET_PHOENIX_EDITOR_SYNC_STORAGE_DIR: /local/editor-sync
      SOCKET_EDITOR_SYNC_RICH_PATCH_TIMEOUT_MS: ${SOCKET_EDITOR_SYNC_RICH_PATCH_TIMEOUT_MS:-8000}
      SOCKET_PHOENIX_BOARD_CHAT_RESUME_ENABLED: ${SOCKET_PHOENIX_BOARD_CHAT_RESUME_ENABLED:-false}
      SOCKET_PHOENIX_BOARD_CHAT_SEND_ENABLED: ${SOCKET_PHOENIX_BOARD_CHAT_SEND_ENABLED:-false}
      SOCKET_PHOENIX_BOARD_CHAT_RECOVERY_ENABLED: ${SOCKET_PHOENIX_BOARD_CHAT_RECOVERY_ENABLED:-false}
      SOCKET_PHOENIX_BOARD_CHAT_RECOVERY_INTERVAL_MS: ${SOCKET_PHOENIX_BOARD_CHAT_RECOVERY_INTERVAL_MS:-5000}
      SOCKET_PHOENIX_CLUSTER_MINIMUM_SIZE: "1"
    volumes:
      - ./volumes/socket_editor_sync:/local/editor-sync
    depends_on:
      api:
        condition: service_healthy
      kafka0:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net
    restart: unless-stopped

  graph:
    init: true
    container_name: ${PROJECT_NAME}_graph
    build:
      context: ../src
      dockerfile: graph/Dockerfile
    env_file:
      - ./envs/.graph.env
    working_dir: /app/src/graph
    command: uv run --no-sync graph run --workers ${GRAPH_WORKERS_COUNT:-1}
    stop_grace_period: 16m
    volumes:
      - ../src/graph/${PROJECT_NAME}_graph:/app/src/graph/${PROJECT_NAME}_graph
      - ../src/shared/py:/app/src/shared/py
      - shared-py-venv:/app/shared/py/.venv
      - ../src/graph/pyproject.toml:/app/src/graph/pyproject.toml
      - ../src/graph/uv.lock:/app/src/graph/uv.lock
      - ../local:/app/local
      - ./volumes/.vault-credentials:/app/.vault-credentials:ro
    depends_on:
      db-bouncer:
        condition: service_healthy
      kafka0:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/src/graph/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen("http://${PROJECT_NAME}_graph:5020/health", timeout=2)
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      - net
    restart: always

volumes:
  shared-py-venv:
    driver: local
