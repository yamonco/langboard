server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Public immutable UI modules/CSS only; never credentialed API responses.
        add_header Access-Control-Allow-Origin "*";
    }

    location = /panel-sdk-resources.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
