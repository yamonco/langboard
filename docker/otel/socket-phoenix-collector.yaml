extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/socket_phoenix:
    config:
      scrape_configs:
        - job_name: langboard_socket_phoenix
          scrape_interval: 10s
          scrape_timeout: 5s
          metrics_path: /internal/metrics
          http_headers:
            X-Socket-Internal-Secret:
              secrets:
                - ${env:SOCKET_PHOENIX_INTERNAL_SECRET}
          static_configs:
            - targets:
                - ${env:PROJECT_NAME}_socket_phoenix:5690

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  nop: {}
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true

service:
  extensions:
    - health_check
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - nop
    metrics:
      receivers:
        - prometheus/socket_phoenix
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheus
