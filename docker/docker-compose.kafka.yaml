x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_PROCESS_ROLES: controller,broker
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${PROJECT_NAME}_kafka0:9093,2@${PROJECT_NAME}_kafka1:9093,3@${PROJECT_NAME}_kafka2:9093
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
  KAFKA_LOG_DIRS: /var/lib/kafka/data/data
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
  MALLOC_ARENA_MAX: 2

services:
  kafka0:
    image: apache/kafka:4.0.2
    container_name: ${PROJECT_NAME}_kafka0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${PROJECT_NAME}_kafka0:9092
    volumes:
      - kfdata0:/var/lib/kafka/data
    networks:
      - net
    restart: always

  kafka1:
    image: apache/kafka:4.0.2
    container_name: ${PROJECT_NAME}_kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${PROJECT_NAME}_kafka1:9092
    volumes:
      - kfdata1:/var/lib/kafka/data
    networks:
      - net
    restart: always

  kafka2:
    image: apache/kafka:4.0.2
    container_name: ${PROJECT_NAME}_kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${PROJECT_NAME}_kafka2:9092
    volumes:
      - kfdata2:/var/lib/kafka/data
    networks:
      - net
    restart: always

volumes:
  kfdata0:
    driver: local
  kfdata1:
    driver: local
  kfdata2:
    driver: local
