<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Langboard work plan</title>
<style>
:root{font:14px system-ui,sans-serif;color:light-dark(#243047,#e3e9f2);background:transparent;--line:light-dark(#e1e6ef,#333e52);--panel:light-dark(#f7f9fc,#171e2d);--muted:light-dark(#627087,#a3afc2);--accent:#9771ea}*{box-sizing:border-box}body{margin:0;padding:16px}header{display:flex;gap:12px;align-items:center}h1{font-size:18px;margin:0}h2{font-size:14px;margin:20px 0 10px}.icon{display:grid;place-items:center;border-radius:12px;background:var(--panel);color:var(--accent);width:38px;height:38px}p{color:var(--muted);line-height:1.5;margin:8px 0}.summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.summary span{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}.card,details,.edge{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);min-width:0;overflow-wrap:anywhere}.ref{display:block;font-size:11px;color:var(--muted);margin-top:5px}summary{cursor:pointer;font-weight:600}ul{padding-left:20px;line-height:1.6}pre{font:12px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin-bottom:0}.edge{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}.arrow{color:var(--accent)}.type{color:var(--muted);font-size:11px}.revision{font:11px ui-monospace,monospace;overflow-wrap:anywhere;margin-top:20px}.notice{border-left:3px solid var(--accent);padding-left:10px}.error{color:light-dark(#b42318,#ffb4ab)}details{margin-bottom:8px}@media(max-width:400px){body{padding:12px}h1{font-size:16px}.edge{font-size:12px}}
</style></head><body>
<header><span class="icon" aria-hidden="true">◇</span><div><h1 id="heading">Work plan preview</h1><p id="status" role="status">Waiting for a reviewed plan…</p></div></header>
<div id="view"></div><p class="notice" id="notice">Preview only. No changes saved. Applying requires a separate authorized tool call.</p>
<script>
// Portable read-only MCP Apps bridge. No tool calls or network access from this view.
const view=document.getElementById('view'), status=document.getElementById('status');
let connected=false;
const setTheme=context=>{if(['light','dark'].includes(context?.theme))document.documentElement.style.colorScheme=context.theme};
const notify=(method,params)=>window.parent.postMessage({jsonrpc:'2.0',method,params},'*');
const element=(tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);if(cls)el.className=cls;return el};
const section=(title)=>{view.append(element('h2',title));const el=element('div');view.append(el);return el};
const detail=(parent,title,text)=>{const d=element('details');d.append(element('summary',title),element('pre',text));parent.append(d)};
function render(result){
 view.replaceChildren();status.classList.remove('error');
 if(result.isError){status.textContent='Preview unavailable. Read current state before trying again.';status.classList.add('error');return}
 let data=result.structuredContent;
 if(!data){try{data=JSON.parse((result.content||[]).find(x=>x.type==='text')?.text||'null')}catch{}}
 const plan=data?.plan;
 if(!plan||typeof data.revision!=='string'){status.textContent='No reviewed plan in this result.';return}
 status.textContent='Reviewed proposal · no changes saved';
 const names=new Map([[plan.anchor_card_uid,'Anchor card']]);
 for(const c of [...(plan.new_cards||[]),...(plan.cardify_checkitems||[])])names.set(c.client_ref,c.title);
 const name=ref=>names.get(ref)||ref;
 const summary=element('div',undefined,'summary');
 for(const [label,count] of [['New cards',plan.new_cards?.length||0],['Promoted items',plan.cardify_checkitems?.length||0],['Connections',plan.add_edges?.length||0],['Removed connections',plan.remove_relationship_uids?.length||0],['Checklists',plan.new_checklists?.length||0]])summary.append(element('span',`${label} · ${count}`));view.append(summary);
 if(plan.new_cards?.length){const cards=section('New cards');cards.className='cards';for(const c of plan.new_cards){const el=element('article',undefined,'card');el.append(element('strong',c.title),element('span','Proposed card','ref'));if(c.description)detail(el,'Description',c.description);cards.append(el)}}
 if(plan.add_edges?.length){const edges=section('Connections');for(const edge of plan.add_edges){const row=element('div',undefined,'edge');row.append(element('span',name(edge.parent_ref)),element('span','→','arrow'),element('span',name(edge.child_ref)));edges.append(row)}detail(edges,'Connection details',plan.add_edges.map(e=>`${e.parent_ref} → ${e.child_ref} · ${e.relationship_type_uid}`).join('\n'))}
 if(plan.cardify_checkitems?.length){const items=section('Promote checklist items to cards');for(const c of plan.cardify_checkitems)detail(items,c.title,`Source card: ${c.source_card_uid}\nChecklist item: ${c.checkitem_uid}\nTarget column: ${c.project_column_uid}\nReference: ${c.client_ref}`)}
 if(plan.new_checklists?.length){const lists=section('New checklists');for(const list of plan.new_checklists){const d=element('details');d.append(element('summary',`${list.title} · ${list.items.length} items`),element('p',`Card: ${name(list.target_card_ref)}`));const ul=element('ul');for(const text of list.items)ul.append(element('li',text));d.append(ul);lists.append(d)}}
 if(plan.remove_relationship_uids?.length)detail(section('Remove connections'),'Relationship IDs',plan.remove_relationship_uids.join('\n'));
 detail(view,'Reviewed version',data.revision);
 if(connected)notify('ui/notifications/size-changed',{height:document.body.scrollHeight,width:document.documentElement.clientWidth});
}
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;
 const message=event.data;
 if(message.id==='langboard-init'&&message.result){connected=true;setTheme(message.result.hostContext);notify('ui/notifications/initialized',{});return}
 if(!connected)return;
 if(message.method==='ui/notifications/host-context-changed')setTheme(message.params);
 if(message.method==='ui/notifications/tool-result')render(message.params||{});
 if(message.method==='ui/notifications/tool-cancelled'){view.replaceChildren();status.textContent='Preview cancelled.'}
 if(message.method==='ui/resource-teardown'){view.replaceChildren();connected=false;window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*')}
});
new ResizeObserver(()=>{if(connected)notify('ui/notifications/size-changed',{height:document.body.scrollHeight,width:document.documentElement.clientWidth})}).observe(document.body);
if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',id:'langboard-init',method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'Langboard Work Plan',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']}}},'*');
</script></body></html>
