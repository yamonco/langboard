<div style="max-width:600px;margin:20px auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)">
  <div style="display:flex;align-items:center;border-bottom:2px solid #8054ff;padding-bottom:10px">
    <img src="{logo_url}" alt="{app_name} Logo" style="width:40px;height:40px;margin-right:10px" />
    <h2 style="margin:0;font-size:20px;color:#333">{app_name}</h2>
  </div>
  <section style="padding:10px 0;font-size:16px;color:#333">
    <p>Hi <span style="color:#8054ff">{recipient}</span>,</p>
    <p><strong>{sender}</strong> made an update in <strong>{project_name}</strong>.</p>
    <p style="padding:12px;border-radius:6px;background:#f6f4ff"><strong>{activity_name}</strong><br />{target_name}</p>
    <p>Open the board to review the latest details.</p>
  </section>
  <div style="text-align:center">
    <a href="{url}" style="display:inline-block;background:#8054ff;color:#fff;text-decoration:none;padding:12px 24px;border-radius:5px;font-weight:bold">Open board</a>
  </div>
</div>
