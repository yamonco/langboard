[project]
name = "langboard-shared"
version = "0.2.0"
description = ""
requires-python = ">=3.12,<3.14"
dependencies = [
    "langboard-sdk==0.2.2",
    "aiosmtplib>=3.0.2,<4",
    "alembic>=1.16.2",
    "anyio>=4.11.0",
    "argcomplete>=3.6.3",
    "bcrypt<=5.0.0",
    "celery>=5.5.3",
    "cryptocode>=0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.121.0",
    "genson>=1.3.0",
    "httpx>=0.28.1",
    "inflect>=7.5.0",
    "jinja2>=3.1.6,<4",
    "kafka-python>=2.2.15",
    "orjson>=3.11.0",
    "psutil>=7.1.2",
    "psycopg[binary]>=3.2.12",
    "pydantic>=2.10.0,<2.20.0",
    "pyjwt>=2.10.1",
    "python-crontab[cron-schedule]>=3.3.0",
    "python-multipart>=0.0.20,<0.1.0",
    "sqlalchemy>=2.0.41,<2.0.50",
    "pyyaml>=6.0.3",
    "redis>=5.2.1,<6.0.0",
    "requests>=2.32.5",
    "rich<=14.2.0",
    "sentry-sdk[fastapi]>=2.43.0",
    "uvicorn[standard]>=0.38.0",
    "hvac>=2.4.0",
]


[project.optional-dependencies]
document-retrieval = [
    "docling-core[chunking-openai]==2.99.0",
    "transformers>=4.42,<6",
    "langchain-text-splitters>=1.1.3,<2",
    "tiktoken>=0.12,<1",
    "langgraph-checkpoint-sqlite==3.1.1",
    "sqlite-vec==0.1.9",
    "langchain-openai==1.6.7",
    "langchain-qdrant==1.1.0",
]
# Native remote VLM conversion; never select standard/models-local extras.
# Transformers supplies import-time types in Docling's VLM module, without Torch.
document-processing = [
    "docling-slim[convert-core,format-pdf,format-office,format-web]==2.133.0",
    "transformers>=4.42,<6",
    "packaging>=24",
]
aws = ["boto3>=1.40.61"]
azure-vault = ["azure-keyvault-keys>=4.11.0", "azure-identity>=1.25.1"]

[dependency-groups]
dev = [
    "ruff>=0.9.7,<0.10",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "boto3-stubs[s3]>=1.40.61",
]


[tool.uv]
link-mode = "copy"


[tool.uv.sources]
langboard-shared = { workspace = true }
langboard-sdk = { path = "../../sdk/vendor/langboard_sdk-0.2.2-py3-none-any.whl" }


[tool.uv.workspace]
members = ["."]


[tool.hatch.build.targets.wheel]
packages = ["langboard_shared"]
exclude = ["**/*_test.py"]


[tool.ruff]
line-length = 120
lint.extend-select = ["I"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.ruff.lint.isort]
lines-after-imports = 2
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
