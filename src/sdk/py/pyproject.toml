[project]
name = "langboard-sdk"
version = "0.1.0"
description = "Native Langboard MCP work commands and REST App management"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langboard_sdk"]
exclude = ["**/*_test.py"]
