<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Langboard panel protocol example</title>
<style>body{font:16px system-ui;background:#101827;color:#e6edf7;margin:24px}button{padding:10px;margin:4px}iframe{width:100%;height:320px;border:1px solid #526076}main{max-width:600px}output{display:block;margin:16px 0}</style>
<main><h1>Panel protocol example</h1><p>Isolated local SDK example. No account, API permissions or business writes.</p><button id="open">Open panel</button><button id="close">Close panel</button><button id="clear">Clear session</button><output id="status">Closed · 0 frames</output><div id="mount"></div></main>
<script type="module">
import {createPanelHost,PanelStateCache} from '../index.mjs';
const cache=new PanelStateCache(),key=JSON.stringify(['example-user','example-board','notes','0.1.0']);
let dispose;
const mount=document.querySelector('#mount'),status=document.querySelector('#status');
function close(){dispose?.();dispose=undefined;mount.replaceChildren();status.textContent='Closed · 0 frames';}
document.querySelector('#open').onclick=()=>{close(); const frame=document.createElement('iframe');frame.title='Notes panel';frame.setAttribute('sandbox','allow-scripts allow-forms');frame.referrerPolicy='no-referrer';frame.addEventListener('load',()=>{dispose=createPanelHost({frame,context:{project_uid:'example-board',app_key:'notes',app_version:'0.1.0',language:'en'},state:cache.get(key),onReady:()=>status.textContent='Ready · 1 frame',onState:state=>{cache.set(key,state);status.textContent='Saved · 1 frame'},onClose:close,onError:()=>{close();status.textContent='Unavailable'}})},{once:true});frame.src='./panel.html';mount.append(frame);status.textContent='Loading · 1 frame'};
document.querySelector('#close').onclick=close;document.querySelector('#clear').onclick=()=>{close();cache.clear();};document.addEventListener('visibilitychange',()=>{if(document.hidden)close()});
</script>
