name: Check Project Provision Owner

on:
  pull_request:
    paths:
      - .github/workflows/check-project-provision.yaml
      - src/api/langboard/mcp_tools/ProjectMcp.py
      - src/api/langboard/mcp_tools/CardMcp.py
      - src/api/langboard/card_workspace/application/**
      - src/api/langboard/card_workspace/infrastructure/native.py
      - src/shared/py/langboard_shared/domain/services/factory/ProjectTemplateService.py
      - src/shared/py/langboard_shared/domain/services/factory/ProjectService.py
      - src/api/tests/project_templates/**
      - src/api/tests/card_workspace/test_commands.py
      - src/api/tests/card_workspace/test_native_adapter.py
  workflow_dispatch:

jobs:
  owner-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: langboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROJECT_NAME: langboard
      LANGBOARD_TEMPLATE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/langboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check src/api/langboard/mcp_tools/ProjectMcp.py src/api/langboard/mcp_tools/CardMcp.py src/api/langboard/card_workspace/application src/api/langboard/card_workspace/infrastructure/native.py src/api/tests/card_workspace/test_commands.py src/api/tests/card_workspace/test_native_adapter.py
      - run: uv run --no-sync pytest -q src/api/tests/card_workspace/test_commands.py src/api/tests/card_workspace/test_native_adapter.py -k 'project_mcp_creation or card_mcp_creation or card_mcp_cardify or card_mcp_people_and_labels'
      - run: uv run --no-sync pytest -q src/api/tests/mcp_integration/test_card_mcp_contract.py

      - run: uv run --no-sync ruff check src/api/tests/project_templates src/shared/py/langboard_shared/domain/services/factory/ProjectTemplateService.py src/shared/py/langboard_shared/domain/services/factory/ProjectService.py
      - run: uv run --no-sync pytest -q src/api/tests/project_templates

      - run: uv run --no-sync pytest -q src/api/tests/card_workspace/test_native_adapter.py src/api/tests/card_workspace/test_queries.py -k project_identity
