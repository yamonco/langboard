source_roots = ["src/api"]
exact = true
forbid_circular_dependencies = true

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

[[modules]]
path = "langboard.card_workspace.domain"
depends_on = []
visibility = [
    "langboard.card_workspace.application",
    "langboard.card_workspace.infrastructure",
    "langboard.mcp_tools.CardWorkspaceMcp",
]

[[modules]]
path = "langboard.card_workspace.application"
depends_on = ["langboard.card_workspace.domain"]
visibility = ["langboard.card_workspace.infrastructure", "langboard.mcp_tools.CardWorkspaceMcp"]

[[modules]]
path = "langboard.card_workspace.infrastructure"
depends_on = ["langboard.card_workspace.application", "langboard.card_workspace.domain"]
visibility = ["langboard.mcp_tools.CardWorkspaceMcp"]

[[modules]]
path = "langboard.mcp_tools.CardWorkspaceMcp"
depends_on = [
    "langboard.card_workspace.application",
    "langboard.card_workspace.domain",
    "langboard.card_workspace.infrastructure",
]
visibility = []
